<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHelp - Student Support Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">🏠 HostelHelp</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#complaint">Complaint</a>
            <a href="#status">Status</a>
        </div>
    </nav>

    <!-- Header -->
    <header id="home">
        <h1>Student Hostel Support Portal</h1>
        <p>Report hostel issues easily and track your complaint status.</p>
    </header>

    <!-- Complaint Form -->
    <section class="container" id="complaint">

        <h2>📝 Submit a Complaint</h2>

        <form id="complaintForm">

            <div class="row">

                <div class="input-group">
                    <label for="name">User Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll" placeholder="Enter roll number" required>
                </div>

                <div class="input-group">
                    <label for="department">Department</label>

                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option>CSE</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                        <option>Biotechnology</option>
                    </select>
                </div>

            </div>

            <div class="input-group">
                <label for="category">Complaint Category</label>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option>Room Maintenance</option>
                    <option>Electricity</option>
                    <option>Water Supply</option>
                    <option>Food / Mess</option>
                    <option>Cleanliness</option>
                    <option>Wi-Fi</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="input-group">
                <label for="subject">Complaint Subject</label>
                <input type="text" id="subject"
                       placeholder="Enter complaint subject" required>
            </div>

            <div class="input-group">
                <label for="description">Complaint Description</label>

                <textarea id="description"
                          placeholder="Describe your problem..."
                          rows="5"
                          required></textarea>
            </div>

            <button type="submit">Submit Complaint</button>

            <p id="successMessage"></p>

        </form>
    </section>

    <!-- Submitted Complaints -->
    <section class="container" id="status">

        <h2>📋 Submitted Complaints</h2>

        <div id="complaintList">
            <p class="empty">No complaints submitted yet.</p>
        </div>

    </section>

    <footer>
        <p>© 2026 HostelHelp | Student Hostel Support Portal</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
